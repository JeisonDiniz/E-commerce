<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Virtual — Estoque Inteligente com ML</title>
    <script>
      // Aplica o tema salvo (se houver) antes do primeiro paint, pra evitar
      // o "flash" de tema claro antes do React montar e ler o localStorage
      // (ver src/hooks/useTheme.ts). Sem escolha salva, segue o tema do
      // sistema operacional via @media (prefers-color-scheme) no CSS.
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "dark" || theme === "light") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {
          /* localStorage indisponível (modo privado etc.) — segue o tema do sistema */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
